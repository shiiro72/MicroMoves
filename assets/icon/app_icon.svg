<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26C6DA" />
      <stop offset="100%" stop-color="#00ACC1" />
    </linearGradient>

    <!-- Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1887F" />
      <stop offset="100%" stop-color="#6D4C41" />
    </linearGradient>

    <!-- Drop Shadow Filter for Pop-Art Feel -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#14171A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" stroke="#1A1C1E" stroke-width="12" />

  <!-- Inner Circle Container -->
  <circle cx="256" cy="256" r="192" fill="#FFF9F0" stroke="#1A1C1E" stroke-width="10" filter="url(#popShadow)" />

  <!-- ENERGY & MOTION SPARKS -->
  <!-- Left hand motion sparks -->
  <path d="M 80 115 C 70 135, 70 160, 80 180" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <line x1="108" y1="95" x2="93" y2="80" stroke="#FFB300" stroke-width="8" stroke-linecap="round" />
  <line x1="140" y1="82" x2="140" y2="62" stroke="#FFB300" stroke-width="8" stroke-linecap="round" />

  <!-- Right hand motion sparks -->
  <path d="M 432 115 C 442 135, 442 160, 432 180" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <line x1="404" y1="95" x2="419" y2="80" stroke="#FFB300" stroke-width="8" stroke-linecap="round" />

  <!-- ALARM / REMINDER BELL BADGE (Top Center-Left) -->
  <g transform="translate(142, 60)">
    <!-- Bell Outer Badge -->
    <circle cx="22" cy="22" r="24" fill="#FFC107" stroke="#1A1C1E" stroke-width="7" />
    <!-- Cartoon Bell Shape -->
    <path d="M 22 10 C 15 10 12 17 12 23 L 32 23 C 32 17 29 10 22 10 Z" fill="#FFF" stroke="#1A1C1E" stroke-width="4" />
    <path d="M 8 23 L 36 23 Q 38 27 32 27 L 12 27 Q 6 27 8 23 Z" fill="#FFF" stroke="#1A1C1E" stroke-width="4" />
    <circle cx="22" cy="30" r="3" fill="#1A1C1E" />
  </g>

  <!-- CARTOON CHARACTER & DESK GROUP -->

  <!-- Desk Surface (anchored inside lower circle) -->
  <rect x="126" y="370" width="260" height="32" rx="16" fill="url(#deskGrad)" stroke="#1A1C1E" stroke-width="9" />

  <!-- Laptop Screen & Keyboard Base -->
  <rect x="210" y="322" width="92" height="48" rx="6" fill="#37474F" stroke="#1A1C1E" stroke-width="7" />
  <rect x="218" y="330" width="76" height="32" rx="4" fill="#80DEEA" />
  <!-- Green Checkmark on Laptop -->
  <path d="M 244 346 L 252 353 L 268 336" fill="none" stroke="#00838F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Character Body / Torso -->
  <path d="M 212 280 Q 205 370 256 370 Q 307 370 300 280 Z"
        fill="url(#shirtGrad)" stroke="#1A1C1E" stroke-width="9" stroke-linejoin="round" />

  <!-- Arms Stretching Up High in Y-Pose -->
  <!-- Left Arm -->
  <path d="M 220 285 C 185 245 142 185 128 132"
        fill="none" stroke="#1A1C1E" stroke-width="30" stroke-linecap="round" />
  <path d="M 220 285 C 185 245 142 185 128 132"
        fill="none" stroke="#26C6DA" stroke-width="16" stroke-linecap="round" />

  <!-- Left Hand (Cartoon Glove) -->
  <circle cx="124" cy="122" r="20" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="8" />
  <circle cx="112" cy="128" r="9" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="6" />

  <!-- Right Arm -->
  <path d="M 292 285 C 327 245 370 185 384 132"
        fill="none" stroke="#1A1C1E" stroke-width="30" stroke-linecap="round" />
  <path d="M 292 285 C 327 245 370 185 384 132"
        fill="none" stroke="#26C6DA" stroke-width="16" stroke-linecap="round" />

  <!-- Right Hand (Cartoon Glove) -->
  <circle cx="388" cy="122" r="20" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="8" />
  <circle cx="400" cy="128" r="9" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="6" />

  <!-- Character Head -->
  <circle cx="256" cy="210" r="52" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="9" />

  <!-- Cute Hair Tuft -->
  <path d="M 242 158 Q 256 136 270 158 Q 260 151 250 158 Z" fill="#5D4037" stroke="#1A1C1E" stroke-width="5" />

  <!-- Rosy Cheeks -->
  <ellipse cx="224" cy="221" rx="11" ry="7" fill="#FF8A80" opacity="0.8" />
  <ellipse cx="288" cy="221" rx="11" ry="7" fill="#FF8A80" opacity="0.8" />

  <!-- Happy Cartoon Eyes (^ ^) -->
  <path d="M 226 205 Q 236 191 246 205" fill="none" stroke="#1A1C1E" stroke-width="8" stroke-linecap="round" />
  <path d="M 266 205 Q 276 191 286 205" fill="none" stroke="#1A1C1E" stroke-width="8" stroke-linecap="round" />

  <!-- Cheerful Big Open Smile Mouth -->
  <path d="M 238 223 Q 256 247 274 223 Z" fill="#D32F2F" stroke="#1A1C1E" stroke-width="6" stroke-linejoin="round" />
  <!-- Tongue -->
  <path d="M 246 233 Q 256 247 266 233 Q 256 227 246 233 Z" fill="#FF8A80" />

</svg>