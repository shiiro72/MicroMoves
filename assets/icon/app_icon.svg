<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Drop Shadow Filter for Pop-Art Badge -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#14171A" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1A1C1E" stroke-width="12" />

  <!-- Inner Cream Sunlight Circle -->
  <circle cx="256" cy="256" r="192" fill="#FFF9F0" stroke="#1A1C1E" stroke-width="10" filter="url(#popShadow)" />

  <!-- DYNAMIC ENERGY SPARKS -->
  <!-- Left arm energy rays -->
  <line x1="86" y1="112" x2="64" y2="92" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <line x1="122" y1="80" x2="112" y2="52" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <path d="M 68 132 C 56 155, 56 180, 68 200" fill="none" stroke="#FFB300" stroke-width="7" stroke-linecap="round" />

  <!-- Right arm energy rays -->
  <line x1="426" y1="112" x2="448" y2="92" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <line x1="390" y1="80" x2="400" y2="52" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  <path d="M 444 132 C 456 155, 456 180, 444 200" fill="none" stroke="#FFB300" stroke-width="7" stroke-linecap="round" />

  <!-- CARTOON STRETCH FIGURE (Modern & Athletic) -->

  <!-- Athletic Shorts Base -->
  <path d="M 204 340 L 308 340 Q 318 340 314 365 L 302 395 Q 298 405 284 405 L 228 405 Q 214 405 210 395 L 198 365 Q 194 340 204 340 Z"
        fill="#1A1C1E" stroke="#1A1C1E" stroke-width="4" stroke-linejoin="round" />

  <!-- Character Shirt/Torso -->
  <path d="M 202 265 C 196 320, 206 345, 256 345 C 306 345, 316 320, 310 265 Z"
        fill="url(#shirtGrad)" stroke="#1A1C1E" stroke-width="9" stroke-linejoin="round" />

  <!-- Arms Stretching Up High in Y-Pose -->
  <!-- Left Arm -->
  <path d="M 210 270 C 168 220, 122 165, 108 112"
        fill="none" stroke="#1A1C1E" stroke-width="32" stroke-linecap="round" />
  <path d="M 210 270 C 168 220, 122 165, 108 112"
        fill="none" stroke="#00E5FF" stroke-width="18" stroke-linecap="round" />
  <circle cx="104" cy="104" r="18" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="7" />

  <!-- Right Arm -->
  <path d="M 302 270 C 344 220, 390 165, 404 112"
        fill="none" stroke="#1A1C1E" stroke-width="32" stroke-linecap="round" />
  <path d="M 302 270 C 344 220, 390 165, 404 112"
        fill="none" stroke="#00E5FF" stroke-width="18" stroke-linecap="round" />
  <circle cx="408" cy="104" r="18" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="7" />

  <!-- Character Head -->
  <circle cx="256" cy="192" r="54" fill="#FFE0B2" stroke="#1A1C1E" stroke-width="9" />

  <!-- Sporty Headband -->
  <path d="M 202 188 C 202 144, 310 144, 310 188 Z" fill="#FF5722" stroke="#1A1C1E" stroke-width="8" />
  <rect x="198" y="182" width="116" height="15" rx="7.5" fill="#FFC107" stroke="#1A1C1E" stroke-width="6" />

  <!-- Confident Smiling Eyes (^ ^) -->
  <path d="M 226 210 C 234 198, 244 198, 250 210" fill="none" stroke="#1A1C1E" stroke-width="7" stroke-linecap="round" />
  <path d="M 262 210 C 268 198, 278 198, 286 210" fill="none" stroke="#1A1C1E" stroke-width="7" stroke-linecap="round" />

  <!-- Confident Smile -->
  <path d="M 242 225 C 250 234, 262 234, 270 225" fill="none" stroke="#1A1C1E" stroke-width="7" stroke-linecap="round" />

</svg>